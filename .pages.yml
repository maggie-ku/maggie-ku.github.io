media:
  input: assets/uploads
  output: /assets/uploads
  rename: random
  extensions: [jpg, jpeg, png, webp, gif]
content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Post date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: description
        label: Short description
        type: text
      - name: tags
        label: Tags
        type: string
        list: true
      - name: published
        label: Publish on site
        type: boolean
        default: true
      - name: comments
        label: Allow comments
        type: boolean
        default: true
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown
          rename: random
  - name: about
    label: About
    type: file
    path: about.md
    format: yaml-frontmatter
    fields:
      - name: layout
        type: string
        hidden: true
        default: default
      - name: title
        type: string
      - name: permalink
        type: string
        readonly: true
      - name: body
        label: About me
        type: rich-text
        options:
          format: markdown
